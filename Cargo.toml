[package]
name = "rosmo360"
version = "0.7.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.7", features = ["derive"] }
# Text overlays: iced's own text engine (the same version), for laying out
# and drawing text into pictures.
cosmic-text = "0.15.0"
cpal = "0.18"
iced = { version = "0.14.0", features = ["advanced", "advanced-shaping", "canvas", "svg", "image"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Pinned: the clip cache (`cache::FORMAT`) holds what this commit parses; move
# the pin on purpose, bumping FORMAT if the rig or attitude changes.
telemetry-parser = { git = "https://github.com/AdrianEddy/telemetry-parser.git", rev = "8bd825db33700c4d4472fae61eada27a65aea7a8", version = "0.4.0" }

# The file managers' D-Bus interface, so Show in folder selects the file
# (the Info panel).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
